---
- name: Create
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
      options: "{{ molecule_yml.driver.options }}"
  tasks:
    - name: "Load proxmox connection secrets."
      ansible.builtin.include_tasks: common/secrets.yml
      when: options.proxmox_secrets is defined

    # Resolve template names to vmids on the instance's node, since each
    # node may have its own local copy of a template with the same name.
    # The proxmox_kvm module searches the whole cluster by name and fails
    # when a name is not unique.
    - name: "Look up template vmid(s)."
      community.proxmox.proxmox_vm_info:
        api_host: "{{ api_host | d(options.api_host) | d(omit) }}"
        api_port: "{{ api_port | d(options.api_port) | d(omit) }}"
        api_user: "{{ api_user | d(options.api_user) | d(omit) }}"
        api_password: "{{ api_password | d(options.api_password) | d(omit) }}"
        api_token_id: "{{ api_token_id | d(options.api_token_id) | d(omit) }}"
        api_token_secret: "{{ api_token_secret | d(options.api_token_secret) | d(omit) }}"
        api_timeout: "{{ options.api_timeout | d(omit) }}"
        validate_certs: "{{ options.validate_certs | d(true) }}"
        type: qemu
        node: "{{ options.node }}"
        name: "{{ p.proxmox_template_name | d(p.template_name, true) | d(options.template_name, true) | d(p.box, true) | d('molecule', true) }}"
      when: not (p.proxmox_template_vmid | d(p.template_vmid, true) | d(false, true))
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        loop_var: p
        label: "{{ p.name }}"
      register: template_info

    - name: "Verify template(s) found."
      ansible.builtin.assert:
        that: t.proxmox_vms | length == 1
        fail_msg: "{{ not_found if t.proxmox_vms | length == 0 else not_unique }}"
        quiet: true
      vars:
        template: "{{ t.p.proxmox_template_name | d(t.p.template_name, true) | d(options.template_name, true) | d(t.p.box, true) | d('molecule', true) }}"
        not_found: "Template '{{ template }}' not found on node '{{ options.node }}'."
        not_unique: >-
          More than one template '{{ template }}' found on node '{{ options.node }}';
          please specify the template by vmid instead.
      when: t is not skipped
      loop: "{{ template_info.results }}"
      loop_control:
        loop_var: t
        label: "{{ t.p.name }}"

    - name: "Set template vmid fact."
      ansible.builtin.set_fact:
        template_vmids: >-
          {{ template_vmids | d({}) | combine({t.p.name: (
               t.proxmox_vms[0].vmid if t is not skipped
               else t.p.proxmox_template_vmid | d(t.p.template_vmid, true))}) }}
      loop: "{{ template_info.results }}"
      loop_control:
        loop_var: t
        label: "{{ t.p.name }}"

    - name: "Create molecule instance(s)."
      community.proxmox.proxmox_kvm:
        state: present
        api_host: "{{ api_host | d(options.api_host) | d(omit) }}"
        api_port: "{{ api_port | d(options.api_port) | d(omit) }}"
        api_user: "{{ api_user | d(options.api_user) | d(omit) }}"
        api_password: "{{ api_password | d(options.api_password) | d(omit) }}"
        api_token_id: "{{ api_token_id | d(options.api_token_id) | d(omit) }}"
        api_token_secret: "{{ api_token_secret | d(options.api_token_secret) | d(omit) }}"
        api_timeout: "{{ options.api_timeout | d(omit) }}"
        vmid: "{{ template_vmids[p.name] }}"
        # The clone value is unused when vmid is set, but is required to clone.
        clone: "{{ template_vmids[p.name] | string }}"
        name: "{{ p.name }}"
        validate_certs: "{{ options.validate_certs | d(true) }}"
        node: "{{ options.node }}"
        full: "{{ options.full | d(omit) }}"
        timeout: "{{ options.timeout | d(omit) }}"
        pool: "{{ options.pool | d(omit) }}"
        newid: "{{ p.newid | d(p.newid, true) | d(omit, true) }}"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        loop_var: p
        label: "{{ p.name }}"
      register: proxmox_clone

    - name: "Update molecule instance config(s)"
      community.proxmox.proxmox_kvm:
        state: present
        update: true
        api_host: "{{ api_host | d(options.api_host) | d(omit) }}"
        api_port: "{{ api_port | d(options.api_port) | d(omit) }}"
        api_user: "{{ api_user | d(options.api_user) | d(omit) }}"
        api_password: "{{ api_password | d(options.api_password) | d(omit) }}"
        api_token_id: "{{ api_token_id | d(options.api_token_id) | d(omit) }}"
        api_token_secret: "{{ api_token_secret | d(options.api_token_secret) | d(omit) }}"
        api_timeout: "{{ options.api_timeout | d(omit) }}"
        validate_certs: false
        vmid: "{{ rc.vmid }}"
        node: "{{ options.node }}"
        timeout: "{{ options.timeout | d(omit) }}"
        ciuser: "{{ rc.p.ciuser | d(omit, true) }}"
        cipassword: "{{ rc.p.cipassword | d(omit, true) }}"
        citype: "{{ rc.p.citype | d(omit, true) }}"
        ipconfig: "{{ rc.p.ipconfig | d(omit, true) }}"
        nameservers: "{{ rc.p.nameservers | d(omit, true) }}"
        searchdomains: "{{ rc.p.searchdomains | d(omit, true) }}"
        sshkeys: "{{ rc.p.sshkeys | d(omit, true) }}"
      when: >
        rc.p.ciuser is defined or
        rc.p.cipassword is defined or
        rc.p.citype is defined or
        rc.p.ipconfig is defined or
        rc.p.nameservers is defined or
        rc.p.searchdomains is defined or
        rc.p.sshkeys is defined
      loop: "{{ proxmox_clone.results }}"
      loop_control:
        loop_var: rc
        label: "{{ rc.p.name, rc.vmid }}"

    - name: "Start molecule instance(s)."
      proxmox_qemu_agent:
        api_host: "{{ api_host | d(options.api_host) | d(omit) }}"
        api_port: "{{ api_port | d(options.api_port) | d(omit) }}"
        api_user: "{{ api_user | d(options.api_user) | d(omit) }}"
        api_password: "{{ api_password | d(options.api_password) | d(omit) }}"
        api_token_id: "{{ api_token_id | d(options.api_token_id) | d(omit) }}"
        api_token_secret: "{{ api_token_secret | d(options.api_token_secret) | d(omit) }}"
        api_timeout: "{{ options.api_timeout | d(omit) }}"
        vmid: "{{ rc.vmid }}"
        timeout: "{{ options.timeout | d(omit) }}"
        validate_certs: "{{ options.validate_certs | d(true) }}"
      loop: "{{ proxmox_clone.results }}"
      loop_control:
        loop_var: rc
        label: "{{ rc.p.name, rc.vmid }}"
      register: proxmox_qemu_agent

    - name: "Populate instance configs."
      ansible.builtin.set_fact:
        instance_config:
          instance: "{{ ra.rc.p.name }}"
          address: "{{ ra.addresses[0] }}"
          user: "{{ options.ssh_user | d('molecule') }}"
          port: "{{ options.ssh_port | d(22) }}"
          identity_file: "{{ options.ssh_identity_file }}"
          vmid: "{{ ra.vmid }}"
          validate_certs: "{{ options.validate_certs | d(true) }}"
      loop: "{{ proxmox_qemu_agent.results }}"
      loop_control:
        loop_var: ra
        label: "{{ ra.rc.p.name, ra.vmid, ra.addresses[0] }}"
      register: instance_configs

    - name: "Set instance_config fact."
      ansible.builtin.set_fact:
        instance_configs: "{{ instance_configs.results | map(attribute='ansible_facts.instance_config') | list }}"

    - name: "Write instance configs."
      ansible.builtin.copy:
        content: "{{ instance_configs | to_nice_yaml }}"
        dest: "{{ molecule_instance_config }}"
        mode: '0644'
