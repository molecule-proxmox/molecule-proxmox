---
- name: Prepare
  hosts: all
  gather_facts: no
  tasks:
    - name: "Waiting for instance ssh connection."
      ansible.builtin.wait_for_connection:

    # Do not change the host name of unmanaged instances (instances with
    # an address), since the user manages those machines.
    - name: "Set host name."
      when:
        - molecule_yml.driver.options.sethostname | d('yes') | bool
        - molecule_yml.platforms | selectattr('name', '==', inventory_hostname) | selectattr('address', 'defined') | selectattr('address') | list | length == 0
      block:
        - name: "Set instance hostname."
          become: yes
          ansible.builtin.hostname:
            name: "{{ inventory_hostname }}"

        - name: "Gather facts."
          ansible.builtin.setup:

        - name: "Remove workaround loopback from /etc/hosts file."
          become: yes
          ansible.builtin.lineinfile:
            state: absent
            path: /etc/hosts
            regex: '^127\.0\.1\.1\s+\S+'

        - name: "Add address and hostname to /etc/hosts file."
          become: yes
          vars:
            ipv4: "{{ ansible_facts['default_ipv4']['address'] }}"
            hostname: "{{ ansible_facts['hostname'] }}"
          ansible.builtin.lineinfile:
            state: present
            path: /etc/hosts
            line: "{{ ipv4 }} {{ hostname }}"
