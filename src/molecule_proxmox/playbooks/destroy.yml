---
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
      options: "{{ molecule_yml.driver.options }}"
      unmanaged_platforms: "{{ molecule_yml.platforms | selectattr('address', 'defined') | selectattr('address') | list }}"
      managed_platforms: "{{ molecule_yml.platforms | rejectattr('name', 'in', unmanaged_platforms | map(attribute='name')) | list }}"
      snapshot_enabled: "{{ options.snapshot | d(false) | bool }}"
      snapshot_name: "{{ options.snapshot_name | d('molecule', true) }}"
      # The snapshot state is kept in the molecule ephemeral directory, so
      # the kept instances are separate for each user, project, and scenario.
      snapshot_state_file: "{{ molecule_ephemeral_directory }}/proxmox_snapshot.yml"
      # In snapshot mode, the kept instances are reset instead of removed.
      # Otherwise, the instances kept from previous runs are removed as well.
      remove_vmids: >-
        {{ config_vmids.values() | list | difference(snapshot_vmids.values() | list) if snapshot_enabled
           else config_vmids.values() | list | union(snapshot_vmids.values() | list) }}
  tasks:
    - name: "Load proxmox connection secrets."
      ansible.builtin.include_tasks: common/secrets.yml
      when: options.proxmox_secrets is defined

    # Remove instances by numeric vmid instead of by name, which seems
    # safer and more reliable. Since the Ansible lookup() plugin complains
    # even when error=ingore is set, just create an empty file to ignore
    # a missing instance_configs.
    - name: "Check for instance configs."
      ansible.builtin.stat:
        path: "{{ molecule_instance_config }}"
      register: instance_config_stat

    - name: "Write empty instance configs."
      ansible.builtin.copy:
        content: "[]"
        dest: "{{ molecule_instance_config }}"
        mode: '0644'
      when: not instance_config_stat.stat.exists

    # Unmanaged instances have no vmid and are never removed.
    - name: "Verify molecule instance(s)."
      ansible.builtin.include_tasks: common/verify_instances.yml
      vars:
        instance_configs: "{{ lookup('file', molecule_instance_config) | from_yaml | selectattr('vmid', 'defined') | list }}"
        verify_vmids: "{{ dict(instance_configs | map(attribute='instance') | zip(instance_configs | map(attribute='vmid'))) }}"

    - name: "Set molecule instance vmid fact."
      ansible.builtin.set_fact:
        config_vmids: "{{ verified_vmids }}"

    - name: "Initialize snapshot instance vmid fact."
      ansible.builtin.set_fact:
        snapshot_vmids: {}

    - name: "Find snapshot instance(s)."
      ansible.builtin.include_tasks: common/snapshot_instances.yml

    - name: "Stop snapshot instance(s)."
      community.proxmox.proxmox_kvm:
        state: stopped
        force: true
        api_host: "{{ api_host | d(options.api_host) | d(omit) }}"
        api_port: "{{ api_port | d(options.api_port) | d(omit) }}"
        api_user: "{{ api_user | d(options.api_user) | d(omit) }}"
        api_password: "{{ api_password | d(options.api_password) | d(omit) }}"
        api_token_id: "{{ api_token_id | d(options.api_token_id) | d(omit) }}"
        api_token_secret: "{{ api_token_secret | d(options.api_token_secret) | d(omit) }}"
        api_timeout: "{{ options.api_timeout | d(omit) }}"
        validate_certs: "{{ options.validate_certs | d(true) }}"
        vmid: "{{ sv.value }}"
        timeout: "{{ options.timeout | d(omit) }}"
      when: snapshot_enabled
      loop: "{{ snapshot_vmids | dict2items }}"
      loop_control:
        loop_var: sv
        label: "{{ sv.key, sv.value }}"

    - name: "Reset snapshot instance(s)."
      community.proxmox.proxmox_snap:
        state: rollback
        api_host: "{{ api_host | d(options.api_host) | d(omit) }}"
        api_port: "{{ api_port | d(options.api_port) | d(omit) }}"
        api_user: "{{ api_user | d(options.api_user) | d(omit) }}"
        api_password: "{{ api_password | d(options.api_password) | d(omit) }}"
        api_token_id: "{{ api_token_id | d(options.api_token_id) | d(omit) }}"
        api_token_secret: "{{ api_token_secret | d(options.api_token_secret) | d(omit) }}"
        api_timeout: "{{ options.api_timeout | d(omit) }}"
        validate_certs: "{{ options.validate_certs | d(true) }}"
        vmid: "{{ sv.value }}"
        snapname: "{{ snapshot_name }}"
        timeout: "{{ options.timeout | d(omit) }}"
      when: snapshot_enabled
      loop: "{{ snapshot_vmids | dict2items }}"
      loop_control:
        loop_var: sv
        label: "{{ sv.key, sv.value }}"

    - name: "Remove molecule instance(s)."
      community.proxmox.proxmox_kvm:
        api_host: "{{ api_host | d(options.api_host) | d(omit) }}"
        api_port: "{{ api_port | d(options.api_port) | d(omit) }}"
        api_user: "{{ api_user | d(options.api_user) | d(omit) }}"
        api_password: "{{ api_password | d(options.api_password) | d(omit) }}"
        api_token_id: "{{ api_token_id | d(options.api_token_id) | d(omit) }}"
        api_token_secret: "{{ api_token_secret | d(options.api_token_secret) | d(omit) }}"
        api_timeout: "{{ options.api_timeout | d(omit) }}"
        state: absent
        vmid: "{{ rv }}"
        validate_certs: "{{ options.validate_certs | d(true) }}"
        node: "{{ options.node }}"
        force: yes
        timeout: "{{ options.timeout | d(omit) }}"
      loop: "{{ remove_vmids }}"
      loop_control:
        loop_var: rv

    - name: "Remove snapshot state."
      ansible.builtin.file:
        path: "{{ snapshot_state_file }}"
        state: absent
      when: not snapshot_enabled
